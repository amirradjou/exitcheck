# Local services for rugcheck. The bot runs on the host (it starts Anvil forks): `make bot`.
services:
  redis:
    image: redis:7.4-alpine
    # A cache, not a database: no persistence, bounded memory, least-recently-used eviction.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
