# Local services for rugcheck. `docker compose up -d` runs the whole live watch (watcher, analyzers, bot);
# `make bot` runs only the bot on the host with Redis from here.
name: rugcheck

services:
  redis:
    image: redis:7.4-alpine
    # A cache, not a database: no persistence, bounded memory, least-recently-used eviction.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: rugcheck
      POSTGRES_PASSWORD: rugcheck
      POSTGRES_DB: rugcheck
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rugcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    # One KRaft node (broker and controller): no ZooKeeper. Services reach it as kafka:9092, the host as
    # localhost:9094.
    environment:
      KAFKA_NODE_ID: 1
      # A few hundred small messages a day. The default heap took most of the stack's memory for nothing.
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by `rugcheck watch` with their partition count; a typo must not make a new one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # The live watch: one watcher for both chains, analyzers in one consumer group (scale with
  # `docker compose up -d --scale analyzer=N`, up to the topic's 6 partitions), and the bot.
  watcher:
    build: .
    image: rugcheck:local
    command: ["watch"]
    environment: &app
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://rugcheck:rugcheck@postgres:5432/rugcheck?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on: &infra
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  analyzer:
    image: rugcheck:local
    command: ["analyze", "-concurrency", "1"]
    environment: *app
    env_file:
      - path: .env
        required: false
    depends_on: *infra
    deploy:
      replicas: 2
    restart: unless-stopped

  bot:
    image: rugcheck:local
    command: ["bot"]
    environment: *app
    env_file:
      - path: .env
        required: false
    depends_on: *infra
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
